<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <form action="http://localhost:3000/name" method="post">
        <!-- POST /name -->
        <input type="text" name="name" />
        <input type="submit" />
    </form>

    <hr />

    <form action="http://localhost:3000/avatar" method="post">
        <!-- POST /avatar -->
        <input type="file" name="avatar" />
        <input type="submit" />
    </form>
</body>
</html>
